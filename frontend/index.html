<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LibraSys</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header><h1>LibraSys</h1><p>Secure single-branch library management</p></header>
<main>
<section class="card"><h2>Sign in</h2><form id="login"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button><button id="logout" type="button" hidden>Sign out</button></form><p id="login-result" role="status"></p></section>
<section class="card"><h2>Catalog</h2><form id="search"><input id="term" placeholder="Search title or ISBN"><button>Search</button></form><table><thead><tr><th>Title</th><th>ISBN</th><th>Publisher</th><th>Available</th></tr></thead><tbody id="results"></tbody></table></section>
<section class="card"><h2>Member lookup</h2><form id="member"><input id="membership" placeholder="Membership number" required><button>Find</button></form><pre id="member-result"></pre></section>
<section class="card"><h2>My fines</h2><button id="load-fines" type="button">Refresh fines</button><p id="fines-result" role="status"></p><table><thead><tr><th>Reason</th><th>Amount</th><th>Paid</th><th>Status</th></tr></thead><tbody id="fines"></tbody></table></section>
<section class="card staff-only"><h2>Overdue report</h2><button id="load-overdue" type="button">Refresh report</button><p id="overdue-result" role="status"></p><table><thead><tr><th>Member</th><th>Title</th><th>Due</th><th>Days overdue</th></tr></thead><tbody id="overdue"></tbody></table></section>
</main>
<script>
const api=window.LIBRASYS_API||'http://localhost:5000';
let token=sessionStorage.getItem('librasys_token')||'';
async function apiFetch(path,options={}){const headers=new Headers(options.headers||{});if(token)headers.set('Authorization','Bearer '+token);return fetch(`${api}${path}`,{...options,headers});}
async function loadCatalog(term=''){const r=await fetch(`${api}/api/catalog?search=${encodeURIComponent(term)}`);const books=await r.json();document.querySelector('#results').innerHTML=books.map(b=>`<tr><td>${escapeHtml(b.title)}</td><td>${escapeHtml(b.isbn)}</td><td>${escapeHtml(b.publisherName||'')}</td><td>${b.availableCopies||0}</td></tr>`).join('');}
document.querySelector('#search').addEventListener('submit',e=>{e.preventDefault();loadCatalog(document.querySelector('#term').value);});
document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch(`${api}/api/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});if(!r.ok){document.querySelector('#login-result').textContent='Sign-in failed';return;}const result=await r.json();token=result.token;sessionStorage.setItem('librasys_token',token);document.querySelector('#logout').hidden=false;document.querySelectorAll('.staff-only').forEach(x=>x.style.display=result.roles.includes('admin')||result.roles.includes('librarian')?'block':'none');document.querySelector('#login-result').textContent=`Signed in as ${escapeHtml(result.displayName)}`;});
document.querySelector('#logout').addEventListener('click',async()=>{if(token)await apiFetch('/api/auth/logout',{method:'POST'});token='';sessionStorage.removeItem('librasys_token');document.querySelector('#logout').hidden=true;document.querySelectorAll('.staff-only').forEach(x=>x.style.display='none');document.querySelector('#login-result').textContent='Signed out';});
document.querySelector('#member').addEventListener('submit',async e=>{e.preventDefault();const n=document.querySelector('#membership').value;const r=await apiFetch(`/api/members/${encodeURIComponent(n)}`);document.querySelector('#member-result').textContent=r.ok?JSON.stringify(await r.json(),null,2):r.status===403?'You can only view your own member record':'Member not found';});
document.querySelector('#load-fines').addEventListener('click',async()=>{const r=await apiFetch('/api/me/fines');const message=document.querySelector('#fines-result');if(!r.ok){message.textContent=r.status===401?'Sign in to view fines':'Unable to load fines';return;}const fines=await r.json();message.textContent=fines.length?'':'No fines found';document.querySelector('#fines').innerHTML=fines.map(f=>`<tr><td>${escapeHtml(f.reason)}</td><td>${Number(f.amount).toFixed(2)}</td><td>${Number(f.paidAmount).toFixed(2)}</td><td>${escapeHtml(f.status)}</td></tr>`).join('');});
document.querySelector('#load-overdue').addEventListener('click',async()=>{const r=await apiFetch('/api/reports/overdue');const message=document.querySelector('#overdue-result');if(!r.ok){message.textContent=r.status===403?'Librarian access required':'Unable to load report';return;}const rows=await r.json();message.textContent=rows.length?'':'No overdue items';document.querySelector('#overdue').innerHTML=rows.map(x=>`<tr><td>${escapeHtml(x.membershipNumber)}</td><td>${escapeHtml(x.title)}</td><td>${escapeHtml(x.dueAt)}</td><td>${x.daysOverdue}</td></tr>`).join('');});
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}loadCatalog();
</script></body></html>
